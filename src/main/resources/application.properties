spring.application.name=feature-phone-gateway

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

telegram.api-id=${TELEGRAM_API_ID}
telegram.api-hash=${TELEGRAM_API_HASH}


# Telegram Executor Configuration
telegram.executor.core-pool-size=2
telegram.executor.max-pool-size=4
telegram.executor.queue-capacity=500