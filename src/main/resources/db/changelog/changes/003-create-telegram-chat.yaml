databaseChangeLog:
  - changeSet:
      id: 003-create-telegram-chat
      author: murat
      changes:
        - createTable:
            tableName: telegram_chat
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: telegram_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_telegram_chat_account
                    references: telegram_account(id)

              - column:
                  name: telegram_chat_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: unread_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: archived
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: telegram_chat
            columnNames: telegram_account_id, telegram_chat_id
            constraintName: uq_telegram_chat_account_chat