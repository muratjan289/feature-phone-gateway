databaseChangeLog:
  - changeSet:
      id: 002-create-telegram-account
      author: murat
      changes:
        - createTable:
            tableName: telegram_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_telegram_account_user
                    references: gateway_user(id)

              - column:
                  name: telegram_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: messages_sent_from_gateway
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: telegram_account
            columnNames: user_id, telegram_user_id
            constraintName: uq_telegram_account_user_telegram