services:
  postgres:
    image: postgres:17
    container_name: feature-phone-postgres

    environment:
      POSTGRES_DB: feature_phone
      POSTGRES_USER: feature_phone
      POSTGRES_PASSWORD: feature_phone

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: